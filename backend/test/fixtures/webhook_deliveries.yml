pending_delivery:
  event_type: "listing.created"
  payload: '{"listing_id": 1, "title": "Test Listing"}'
  url: "https://example.com/webhook"
  status: "pending"
  attempts: 0

delivered_delivery:
  event_type: "listing.sold"
  payload: '{"listing_id": 2, "title": "Sold Item"}'
  url: "https://example.com/webhook"
  status: "delivered"
  attempts: 1
  last_attempt_at: <%= 1.hour.ago %>
  response_code: 200
  response_body: '{"ok": true}'

failed_delivery:
  event_type: "signal.promoted"
  payload: '{"signal_id": 5, "topic": "Test Signal"}'
  url: "https://example.com/webhook"
  status: "failed"
  attempts: 3
  last_attempt_at: <%= 30.minutes.ago %>
  response_code: 500
  response_body: "Internal Server Error"
